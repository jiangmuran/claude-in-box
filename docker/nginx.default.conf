# Minimal nginx site config dropped in by `cib-services start nginx`.
#
# When the user wants nginx fronting things inside the container (e.g.,
# locally serving a static site, or proxying to a FastAPI dev server on
# :5000), they edit this file and `nginx -s reload`.
#
# Note: if you front the cib control plane itself with nginx, prefer the
# template at /usr/share/doc/claude-in-box/nginx.conf.template
# (originally docker/nginx.conf.template at the repo root) — it handles
# WebSocket upgrades and SSE buffering correctly.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Example: proxy a FastAPI dev server running on :5000.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
